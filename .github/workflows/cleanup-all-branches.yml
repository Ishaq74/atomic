name: One Main Branch Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            for (const branch of branches) {
              if (branch.name === 'main' || branch.protected) continue;
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch.name}` });
              core.info(`Deleted ${branch.name}`);
            }

      - name: Remove cleanup workflow
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.github/workflows/cleanup-all-branches.yml';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path,
              message: 'chore(repo): remove one-time branch cleanup workflow',
              sha: current.data.sha,
              branch: 'main',
            });
