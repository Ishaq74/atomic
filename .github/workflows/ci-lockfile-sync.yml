name: CI lockfile sync

on:
  push:
    branches:
      - feature/cms-platform-foundation
    paths:
      - .github/workflows/ci-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.event.head_commit.message != 'chore(ci): sync pnpm lockfile result'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/ci-lockfile-sync.yml
          git rm .github/workflows/ci-lockfile-sync.yml
          git commit -m "chore(ci): sync pnpm lockfile result"
          git push