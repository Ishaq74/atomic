name: finalize-blog-schema-invariants

on:
  push:
    branches:
      - feature/cms-platform-schema-invariants
    paths:
      - .atomic-schema-finalize

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ hashFiles('.atomic-schema-finalize') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cms-platform-schema-invariants
          fetch-depth: 1

      - name: Apply exact reaction schema invariant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/database/schemas/blog.schema.ts')
          s = p.read_text()

          old = '(table) => [primaryKey({ columns: [table.postId, table.userId, table.reactionType] })],'
          new = '(table) => [primaryKey({ columns: [table.postId, table.userId] })],'
          if s.count(old) != 1:
              raise SystemExit(f'reaction primary key pattern count={s.count(old)}, expected 1')
          p.write_text(s.replace(old, new, 1))
          PY

          rm .atomic-schema-finalize

      - name: Commit schema invariant
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/database/schemas/blog.schema.ts .atomic-schema-finalize
          git commit -m "fix(blog): align reaction schema key with domain invariant"
          git push origin HEAD:feature/cms-platform-schema-invariants

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/atomic-schema-finalize.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary schema finalization workflow" || exit 0
          git push origin HEAD:feature/cms-platform-schema-invariants
